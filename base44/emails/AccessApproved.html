<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Trucky access is approved</title>
  </head>
  <body style="margin:0; padding:0; background-color:#1A1625;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#1A1625; padding:36px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px; max-width:600px; background-color:#252033; border:1px solid #322C45; border-radius:12px; overflow:hidden;">

            <tr>
              <td style="background-color:#7C5DFA; height:4px; line-height:4px; font-size:0;">&nbsp;</td>
            </tr>

            <tr>
              <td align="center" style="padding:34px 32px 6px 32px;">
                <img src="https://media.base44.com/images/public/69e8214a181314e517a283d5/44172150a5b356e3292b488876c91210_trucky-logo-transparente.png" alt="Trucky" width="150" style="display:block; width:150px; max-width:150px; height:auto; border:0; outline:none; text-decoration:none;" />
              </td>
            </tr>

            <tr>
              <td style="padding:22px 32px 0 32px;">
                <p style="margin:0 0 10px 0; font-family:'Inter', Arial, Helvetica, sans-serif; font-size:11px; line-height:1.4; font-weight:700; letter-spacing:1.6px; text-transform:uppercase; color:#00E396;">
                  Access approved
                </p>
                <p style="margin:0 0 14px 0; font-family:'Inter', Arial, Helvetica, sans-serif; font-size:21px; line-height:1.3; font-weight:700; color:#ffffff;">
                  You are in
                </p>
                <p style="margin:0; font-family:'Inter', Arial, Helvetica, sans-serif; font-size:15px; line-height:1.6; color:#A9A8C7;">
                  Your access to Trucky has been approved. Sign in to start tracking rates, loads and costs from one place.
                </p>
              </td>
            </tr>

            <tr>
              <td style="padding:26px 32px 30px 32px;">
                <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td align="left">
                      <a href="{{action_url}}" style="display:inline-block; background-color:#7C5DFA; color:#ffffff; font-family:'Inter', Arial, Helvetica, sans-serif; font-size:15px; line-height:1; font-weight:700; text-decoration:none; padding:15px 30px; border-radius:8px;">
                        Open Trucky
                      </a>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <tr>
              <td style="padding:0 32px 34px 32px; border-top:1px solid #322C45;">
                <p style="margin:18px 0 0 0; font-family:'Inter', Arial, Helvetica, sans-serif; font-size:13px; line-height:1.6; color:#8B86A0;">
                  If you believe you received this by mistake, reply to this email and we will take a look.
                </p>
              </td>
            </tr>

          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
