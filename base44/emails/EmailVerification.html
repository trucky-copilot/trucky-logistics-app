<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your verification code</title>
  </head>
  <body style="margin:0; padding:0; background-color:#0e0a19;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#0e0a19; padding:32px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px; max-width:600px; background-color:#1a1a24; border:1px solid #2f2f42; border-radius:12px; overflow:hidden;">

            <!-- Header: logo sobre el mismo fondo del logo -->
            <tr>
              <td align="center" style="background-color:#1a1a24; padding:32px 32px 8px 32px;">
                <img src="https://media.base44.com/images/public/69e8214a181314e517a283d5/aa84727d5331a2ec1c997246932bbe74_trucky-logo.png" alt="Trucky" width="150" style="display:block; width:150px; max-width:150px; height:auto; border:0; outline:none; text-decoration:none;" />
              </td>
            </tr>

            <!-- Body -->
            <tr>
              <td style="padding:24px 32px 8px 32px;">
                <p style="margin:0 0 16px 0; font-family:'Inter', Arial, Helvetica, sans-serif; font-size:20px; line-height:1.3; font-weight:700; color:#ffffff;">
                  Hey {{first_name}},
                </p>
                <p style="margin:0; font-family:'Inter', Arial, Helvetica, sans-serif; font-size:15px; line-height:1.6; color:#a9a8c7;">
                  Use this verification code to finish setting up your account for Trucky:
                </p>
              </td>
            </tr>

            <!-- Code -->
            <tr>
              <td style="padding:28px 32px 28px 32px;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td align="center" style="background-color:#232333; border:1px solid #2f2f42; border-radius:12px; padding:24px 16px;">
                      <span style="font-family:'JetBrains Mono', 'Courier New', monospace; font-size:34px; line-height:1.2; font-weight:700; letter-spacing:12px; color:#ffffff; display:block; text-align:center;">
                        {{otp_code}}
                      </span>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- Footer note -->
            <tr>
              <td style="padding:0 32px 32px 32px;">
                <p style="margin:0; font-family:'Inter', Arial, Helvetica, sans-serif; font-size:13px; line-height:1.6; color:#a9a8c7;">
                  This code expires in 10 minutes. If you did not request it, you can safely ignore this email.
                </p>
              </td>
            </tr>

          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
