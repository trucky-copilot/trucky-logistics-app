<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your verification code</title>
  </head>
  <body style="margin:0; padding:0; background-color:#0e0a19;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#0e0a19; padding:32px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px; max-width:600px; background-color:#0e0a19; border:1px solid #2a2340; border-radius:12px; overflow:hidden;">

            <!-- Header band -->
            <tr>
              <td style="background-color:#5331d8; padding:20px 32px;">
                <span style="font-family:'Space Grotesk', Arial, Helvetica, sans-serif; font-size:16px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:#ffffff;">
                  {{app_name}}
                </span>
              </td>
            </tr>

            <!-- Body -->
            <tr>
              <td style="padding:36px 32px 8px 32px;">
                <p style="margin:0 0 16px 0; font-family:'Inter', Arial, Helvetica, sans-serif; font-size:20px; line-height:1.3; font-weight:700; color:#ffffff;">
                  Hey {{first_name}},
                </p>
                <p style="margin:0; font-family:'Inter', Arial, Helvetica, sans-serif; font-size:15px; line-height:1.6; color:#a9a8c7;">
                  Use this verification code to finish setting up your account for {{app_name}}:
                </p>
              </td>
            </tr>

            <!-- Code -->
            <tr>
              <td style="padding:28px 32px 28px 32px;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td align="center" style="background-color:#17122a; border:1px solid #2a2340; border-radius:12px; padding:24px 16px;">
                      <span style="font-family:'JetBrains Mono', 'Courier New', monospace; font-size:34px; line-height:1.2; font-weight:700; letter-spacing:12px; color:#ffffff; display:block; text-align:center;">
                        {{otp_code}}
                      </span>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- Footer note -->
            <tr>
              <td style="padding:0 32px 36px 32px;">
                <p style="margin:0; font-family:'Inter', Arial, Helvetica, sans-serif; font-size:13px; line-height:1.6; color:#a9a8c7;">
                  This code expires in 10 minutes. If you did not request it, you can safely ignore this email.
                </p>
              </td>
            </tr>

          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
